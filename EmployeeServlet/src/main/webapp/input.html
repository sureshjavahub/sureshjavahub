<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>

<form action="form" method="get">
<table>
<caption>Employee Data</caption>


<tr><td>Employee Id:     <input type="number" name="id"></td>
</tr>

<tr><td>Employee Name:<input type="text" name="name"></td></tr>
<tr><td>Employee Address:<input type="text" name="add"></td></tr>
<tr><td>Employee Salary:<input type="number" name="sal"></td></tr>
<tr><td>Employee Gender:</td>
<td>Male<input type="radio" name="gender" value="Male"></td>
<td>Female<input type="radio" name="gender" value="Female"></td>
</tr>
<tr><td>Employee Profile:</td>
<td>Developer<input type="radio" name="profile" value="Developer"></td>
<td>Tester<input type="radio" name="profile" value="Tester"></td>
<td>QA<input type="radio" name="profile" value="QA"></td>

</tr>

<tr>

<td>Employee Hobbies</td>

<td>Reading<input type="checkbox" name="hobby" value="Reading"></td>
<td>Writing<input type="checkbox" name="hobby" value="Writing"></td>
<td>Searching<input type="checkbox" name="hobby" value="Searching"></td>
<td>Coding<input type="checkbox" name="hobby" value="Coding"></td></tr>

<tr>
<td><input type="submit"  ></td>
</tr>

</table>
</form>


</body>
</html>
